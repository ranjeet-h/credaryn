services:
  dss:
    build:
      context: .
      args:
        DSS_VERSION: "6.5"
    environment:
      DSS_VERSION: "6.5"
      DSS_ISSUER_ID: "acme-retail"
      DSS_KEY_ID: "dss-demo-key"
      DSS_KEY_ALIAS: "credaryn-demo"
      DSS_KEYSTORE_PASSWORD: "changeit"
      # Optional RFC 3161 TSA. Empty (the default) keeps the boundary at B-B;
      # set it to advertise B-T capability on /health and accept level "B-T".
      DSS_TSA_URL: "${DSS_TSA_URL:-}"
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health | grep -q '\"status\":\"ready\"'"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
