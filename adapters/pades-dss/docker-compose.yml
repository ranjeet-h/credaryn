services:
  dss:
    build:
      context: .
      args:
        DSS_VERSION: "6.5"
    environment:
      DSS_VERSION: "6.5"
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health | grep -q '\"status\":\"ready\"'"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
