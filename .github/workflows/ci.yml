name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, tests, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Trust-boundary lint
        run: pnpm lint
      - name: Tests
        run: pnpm test
      - name: Coverage (enforced thresholds)
        run: pnpm exec vitest run --coverage
      - name: Docs check
        run: pnpm docs:check

  audit:
    name: dependency audit (high severity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit (fails on high/critical)
        run: pnpm audit --audit-level high

  secrets:
    name: secret pattern guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed private keys / cloud credentials
        run: |
          set -euo pipefail
          matches=$(grep -rInE 'BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|-----BEGIN OPENSSH PRIVATE KEY-----' \
            --exclude-dir=node_modules --exclude-dir=.git . || true)
          if [ -n "$matches" ]; then
            echo "Potential secret material detected:"; echo "$matches"; exit 1
          fi
          echo "No private-key or cloud-credential patterns detected."
