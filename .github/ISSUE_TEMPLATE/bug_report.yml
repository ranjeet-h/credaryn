name: Bug report
description: Report a reproducible defect in Credaryn
title: "[bug] "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security vulnerabilities, do **not** use this form — see SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs observed
      description: What you expected, and what actually happened (include verdicts/codes).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Exact commands or page actions. Redact secrets and customer data.
      placeholder: |
        1. pnpm install --frozen-lockfile
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit / version
      placeholder: output of `git rev-parse --short HEAD`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Node, pnpm, browser, Docker/DSS version"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / evidence
      description: Relevant output. Do not include private keys, tokens or documents.
    validations:
      required: false
