# Air-gapped override. Enable with:
#
#   docker compose -f deploy/docker-compose.yml \
#     -f deploy/docker-compose.air-gapped.yml up -d
#
# Guarantees and limits:
#   - The verifier loads only the operator-controlled local public trust bundle
#     (no did:web, status, TSA or hosted Credaryn fetch).
#   - The DSS signing service is attached only to an internal Docker network with
#     no external route.
#   - The verifier UI binds to host loopback for an isolated workstation.
#   - No status/admin profiles start; online lifecycle state is UNCHECKED with
#     freshness UNAVAILABLE.
#
# Compose cannot remove the host route for a service whose port is published, so
# the signing service is isolated and the operator must also block egress at the
# host/network layer. See docs/deployment/air-gapped.md.

services:
  dss:
    networks:
      - air-gapped-internal

  verifier:
    environment:
      CREDARYN_TRUST_STORE: /run/trust/trust-store.json
      CREDARYN_ALLOWED_ORIGINS: "http://127.0.0.1:${CREDARYN_VERIFIER_PORT:-8080}"
    volumes:
      - ${CREDARYN_AIR_GAPPED_TRUST_BUNDLE:-./trust/air-gapped-trust-store.json}:/run/trust/trust-store.json:ro
    ports: !override
      - "127.0.0.1:${CREDARYN_VERIFIER_PORT:-8080}:4173"
    networks:
      - default
      - air-gapped-internal

networks:
  air-gapped-internal:
    internal: true
