# Self-hosted Credaryn Compose bundle.
#
# Default services: dss (PAdES reference engine) + verifier (API/UI).
# Optional profiles:
#   status : status API + PostgreSQL status store
#   admin  : admin reference surface (fails closed until OIDC wiring lands)
# Air-gapped operators add deploy/docker-compose.air-gapped.yml; see
# deploy/README.md and docs/deployment/air-gapped.md.
#
# Secrets are read from files under deploy/secrets/ (git-ignored); see
# deploy/README.md. All base images (postgres, and the verifier/DSS images'
# Dockerfile FROM references) are pinned by digest.

services:
  dss:
    build:
      context: ../adapters/pades-dss
      dockerfile: Dockerfile
      args:
        DSS_VERSION: "6.5"
    entrypoint: ["/bin/bash", "/opt/credaryn/entrypoint-with-secret.sh"]
    volumes:
      - ./dss-entrypoint-secret.sh:/opt/credaryn/entrypoint-with-secret.sh:ro
    environment:
      DSS_VERSION: "6.5"
      DSS_ISSUER_ID: "acme-retail"
      DSS_KEY_ID: "dss-demo-key"
      DSS_KEY_ALIAS: "credaryn-demo"
      DSS_KEYSTORE_PASSWORD_FILE: /run/secrets/dss_keystore_password
    secrets:
      - dss_keystore_password
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health | grep -q '\"status\":\"ready\"'"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

  verifier:
    build:
      context: ..
      dockerfile: apps/verifier-web/Dockerfile
    environment:
      HOST: "0.0.0.0"
      PORT: "4173"
      DSS_URL: "http://dss:8080"
      CREDARYN_BUILD_VERSION: "local-compose"
      CREDARYN_ALLOWED_ORIGINS: "http://localhost:${CREDARYN_VERIFIER_PORT:-8080}"
      # Optional lifecycle status resolution; empty disables it (lifecycle stays UNCHECKED).
      CREDARYN_STATUS_URL: "${CREDARYN_STATUS_URL:-}"
      CREDARYN_STATUS_ALLOW_INSECURE: "${CREDARYN_STATUS_ALLOW_INSECURE:-false}"
      # Optional OTLP exporter; empty keeps telemetry local.
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    depends_on:
      dss:
        condition: service_healthy
    ports:
      - "${CREDARYN_VERIFIER_PORT:-8080}:4173"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4173/v1/health').then(r => { if (!r.ok) process.exit(1) })\""]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  status-db:
    image: postgres:16-alpine@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb
    profiles: [status]
    environment:
      POSTGRES_DB: credaryn
      POSTGRES_USER: credaryn
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - status-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credaryn -d credaryn"]
      interval: 10s
      timeout: 3s
      retries: 5

  status:
    build:
      context: ..
      dockerfile: apps/verifier-web/Dockerfile
    profiles: [status]
    # The wrapper reads the password secret and exports DATABASE_URL; the service then
    # selects the durable Postgres repository instead of the in-memory fallback.
    entrypoint: ["/bin/sh", "/opt/credaryn/status-entrypoint-secret.sh"]
    command: ["node", "node_modules/tsx/dist/cli.mjs", "services/status/src/server.ts"]
    environment:
      STATUS_HOST: "0.0.0.0"
      STATUS_PORT: "4174"
      STATUS_DB_HOST: "status-db"
      STATUS_DB_PORT: "5432"
      POSTGRES_USER: "credaryn"
      POSTGRES_DB: "credaryn"
      # Writes stay disabled until the operator supplies a token.
      STATUS_ADMIN_TOKEN: "${STATUS_ADMIN_TOKEN:-}"
    volumes:
      - ./status-entrypoint-secret.sh:/opt/credaryn/status-entrypoint-secret.sh:ro
    secrets:
      - postgres_password
    depends_on:
      status-db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    expose:
      - "4174"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4174/health').then(r => { if (!r.ok) process.exit(1) })\""]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  # Admin runs the @credaryn/admin reference launcher. It uses real OIDC/JWKS verification when
  # CREDARYN_OIDC_ISSUER + CREDARYN_OIDC_JWKS_URI are set, and fails closed (501) otherwise.
  admin:
    build:
      context: ..
      dockerfile: apps/verifier-web/Dockerfile
    profiles: [admin]
    command: ["node", "node_modules/tsx/dist/cli.mjs", "apps/admin/src/main.ts"]
    environment:
      ADMIN_HOST: "0.0.0.0"
      ADMIN_PORT: "4175"
      CREDARYN_OIDC_ISSUER: "${CREDARYN_OIDC_ISSUER:-}"
      CREDARYN_OIDC_JWKS_URI: "${CREDARYN_OIDC_JWKS_URI:-}"
      CREDARYN_OIDC_AUDIENCE: "${CREDARYN_OIDC_AUDIENCE:-}"
      CREDARYN_ADMIN_ALLOWED_ORIGINS: "${CREDARYN_ADMIN_ALLOWED_ORIGINS:-}"
    read_only: true
    tmpfs:
      - /tmp
    expose:
      - "4175"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4175/health').then(r => { if (!r.ok) process.exit(1) })\""]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  status-db:

secrets:
  dss_keystore_password:
    file: ./secrets/dss_keystore_password
  postgres_password:
    file: ./secrets/postgres_password
